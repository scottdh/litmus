name: Ticket
description: One piece of work
body:
  - type: textarea
    id: why
    attributes: { label: Why }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: '- [ ] '
    validations: { required: true }
  - type: textarea
    id: design
    attributes:
      label: Design goals
      description: Design tickets only. The problem; who and which task; what success looks like; what must stay; how far options should range.
  - type: textarea
    id: scope
    attributes:
      label: Scope paths
      description: Backticked globs. Where you expect to work, not a fence.
    validations: { required: true }
  - type: textarea
    id: out
    attributes: { label: Out of scope / related }
